<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RentEase</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--c:#fff;--k:#111;--m:#6f6a60;--b:#e2dac9;--o:#ff5a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141311;--c:#1f1d1a;--k:#f6f1e7;--m:#a39e92;--b:#37332d}}
:root[data-theme=dark]{--bg:#141311;--c:#1f1d1a;--k:#f6f1e7;--m:#a39e92;--b:#37332d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--k);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,.lg{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;text-transform:uppercase}h2{font-size:26px;margin:8px 0}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--b)}
.lg{font-size:26px;flex:none}.lg b{color:var(--o);font-weight:400}#hq{flex:1;max-width:380px}
input,select,textarea{font:inherit;color:var(--k);background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px 12px;width:100%}
.btn{background:var(--k);color:var(--bg);border:0;border-radius:99px;padding:10px 16px;font:600 14px Inter,sans-serif;cursor:pointer}.btn.o{background:var(--o);color:#fff}.btn.g{background:none;color:var(--k);border:1px solid var(--k)}
.sw{position:relative;margin-left:auto}.menu{position:absolute;right:0;top:110%;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:6px;min-width:160px;z-index:9}.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px;border-radius:8px;color:var(--k);font:inherit;cursor:pointer}
nav.tn{display:flex;gap:4px;padding:8px 16px;overflow-x:auto}.nv{background:none;border:0;padding:8px 14px;border-radius:99px;font:600 14px Inter,sans-serif;color:var(--m);cursor:pointer;white-space:nowrap}.nv.on{background:var(--k);color:var(--bg)}
nav.bn{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--b);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:5}.bn .nv{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:4px 6px;border-radius:10px}
main{max-width:1100px;margin:0 auto;padding:16px 16px 110px}
.hero{background:var(--k);color:var(--bg);border-radius:24px;padding:28px;margin-bottom:16px}.hero h1{font-size:clamp(34px,7vw,64px);margin:0;line-height:1}.hero em{color:var(--o);font-style:normal}.hero p{opacity:.7;margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.card,.box{background:var(--c);border:1px solid var(--b);border-radius:20px;overflow:hidden}.box{padding:16px;margin-bottom:12px}
.im{height:150px;background:#ece3d0;display:grid;place-items:center;font-size:64px;position:relative;cursor:pointer;color:#111}.im img,.th img{width:100%;height:100%;object-fit:cover}
.hrt{position:absolute;top:8px;right:8px;border:0;background:var(--c);color:var(--o);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.cb{padding:12px;display:grid;gap:4px}small{color:var(--m)}.cb .btn{margin-top:6px}.tg{font-style:normal;font-size:11px;background:#ffe3d6;color:#b53a0b;padding:2px 8px;border-radius:99px;margin-left:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}.ch{border:1px solid var(--b);background:var(--c);color:var(--k);border-radius:99px;padding:6px 12px;cursor:pointer;font:inherit}.ch.on{background:var(--o);border-color:var(--o);color:#fff}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.flt label{font-size:12px;color:var(--m);width:100px}.flt select{width:auto}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.th{width:56px;height:56px;border-radius:12px;background:#ece3d0;display:grid;place-items:center;font-size:28px;overflow:hidden;color:#111}.sp{flex:1;min-width:150px}
.st{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:#eee;color:#333}.Confirmed,.Available,.Completed{background:#d9f2e0;color:#17653a}.Pending,.Booked,.Paused{background:#ffe9c7;color:#8a5a00}.Declined,.Cancelled{background:#fadcd9;color:#a1271c}.Active{background:#dbe8ff;color:#1f4fa8}
#modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end;justify-content:center}#modal.on{display:flex}.mb{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}
@media(min-width:700px){#modal{align-items:center}.mb{border-radius:24px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--k);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;display:none}
.stats,.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.stats b{font:400 28px Anton,Impact,sans-serif;display:block}.tiles .btn{padding:18px;border-radius:18px;text-align:left}
.bars{display:flex;gap:10px;align-items:end;height:170px;padding-bottom:22px}.bars div{flex:1;background:var(--o);border-radius:8px 8px 0 0;position:relative}.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--m)}
.er{color:#c0291c;font-size:13px}label.f{display:block;font-size:12px;color:var(--m);margin-top:8px}
@media(max-width:700px){nav.tn,#hq{display:none}nav.bn{display:flex}}
</style></head><body><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),dd=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},T=dd(0);
const inr=n=>'₹'+Number(n).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['All','Cameras','Laptops','Lighting','Tripods','Projectors','Audio','Gaming','Other'];
const FC={Camera:'Cameras',Lens:'Cameras',Lighting:'Lighting',Laptop:'Laptops',Tripod:'Tripods',Projector:'Projectors',Audio:'Audio',Gaming:'Gaming',Other:'Other'};
const IC={Cameras:'📷',Laptops:'💻',Lighting:'💡',Tripods:'📐',Projectors:'📽️',Audio:'🔊',Gaming:'🎮',Other:'📦'};
const LK={Ahmedabad:1.2,Gandhinagar:18.5,Bopal:6.8,Satellite:2.4,Navrangpura:1.5,Vastrapur:2.1,'SG Highway':4.2,Thaltej:3.6};
const OW=['Toshan','Rahul Mehta','Priya Shah','Karan Patel','Neha Desai','Amit Joshi'];
const TABS={Upcoming:['Pending','Confirmed'],Active:['Active'],Completed:['Completed'],Cancelled:['Cancelled','Declined']};
const NC=[['Home','home','🏠',1],['Search','search','🔍',1],['Near Me','near','📍',1],['Favorites','favs','♡',0],['Bookings','bookings','🧾',1],['Profile','profile','👤',1]];
const NB=[['Dashboard','dash','📊',1],['Search','search','🔍',1],['My Equipment','equip','📦',0],['Upload','upload','➕',1],['Requests','req','📥',1],['Earnings','earn','💰',0],['Profile','profile','👤',1]];
function seed(){const L=[['Sony A7 IV','Cameras',0,4.8,'Navrangpura',1.4,1200,10000,'📷'],['Canon EOS R6','Cameras',1,4.7,'Satellite',2.6,1400,12000,'📷'],['Sony ZV-E10','Cameras',2,4.6,'Bopal',6.8,800,6000,'📸'],['DJI Action 4 Camera','Cameras',3,4.7,'Thaltej',4.1,500,4000,'🎥'],['DJI RS3 Gimbal','Other',0,4.7,'Vastrapur',2.1,700,6000,'🎛️'],['MacBook Pro 14','Laptops',4,4.9,'SG Highway',3.2,1500,20000,'💻'],['Epson Projector','Projectors',0,4.6,'Satellite',2.7,900,8000,'📽️'],['JBL PartyBox Speaker','Audio',5,4.7,'Vastrapur',1.8,600,5000,'🔊'],['PS5 Console + 2 Controllers','Gaming',1,4.8,'Bopal',4.5,1000,15000,'🎮'],['DualSense Controller','Gaming',2,4.8,'Navrangpura',1.1,250,2000,'🕹️'],['FIFA 24 PS5 Game CD','Gaming',3,4.5,'Thaltej',3.6,150,1500,'💿'],['Godox LED Lighting Kit','Lighting',0,4.6,'Satellite',2.2,450,4000,'💡'],['Manfrotto Tripod','Tripods',4,4.7,'SG Highway',5.2,200,2500,'📐'],['Rode Wireless Microphone','Audio',5,4.8,'Gandhinagar',14.2,350,3500,'🎙️'],['Sony 24-70 GM Lens','Cameras',0,4.9,'Vastrapur',3,900,9000,'🔭']].map((a,i)=>({id:i+1,name:a[0],cat:a[1],o:a[2],r:a[3],loc:a[4],km:a[5],p:a[6],dep:a[7],ic:a[8],st:'Available',v:10+i*7,desc:a[0]+' in excellent working condition, ideal for shoots, events and projects.',cond:'Excellent',acc:'Carry case, charger, cables',rules:'Return in same condition. Late fee ₹200/day.',av:'Every day, 9 AM – 9 PM'}));
const B=(id,lid,nm,rid,rn,s,e,d,rent,dep,st)=>({id:'RENT-'+id,lid,nm,o:L[lid-1].o,rid,rn,s:dd(s),e:dd(e),d,rent,dep,st});
return{mode:'consumer',L,fav:[],rec:['camera','projector'],nl:16,nb:10246,ver:1,me:{name:'Toshan',email:'toshan@rentease.in',phone:'+91 98250 12345',loc:'Ahmedabad'},B:[B(10241,2,'Canon EOS R6',0,'Toshan',3,5,3,4200,12000,'Confirmed'),B(10242,6,'MacBook Pro 14',0,'Toshan',-1,1,3,4500,20000,'Active'),B(10243,9,'PS5 Console + 2 Controllers',0,'Toshan',7,8,2,2000,15000,'Cancelled'),B(10244,1,'Sony A7 IV',9,'Ishita Rao',2,4,3,3600,10000,'Pending'),B(10240,7,'Epson Projector',8,'Vivek Nair',-20,-18,3,2700,8000,'Completed'),B(10239,10,'DualSense Controller',0,'Toshan',-15,-14,2,500,2000,'Completed')]}}
let S;try{S=JSON.parse(localStorage.getItem('re1'))}catch(e){}if(!S||!S.L)S=seed();
const save=()=>{try{localStorage.setItem('re1',JSON.stringify(S))}catch(e){}};
const ui={v:'home',q:'',cat:'All',min:0,max:5000,sort:'rel',near:0,tab:'Upcoming',m:null,sw:0};
const gl=id=>S.L.find(l=>l.id==id),ow=l=>l.o==0?S.me.name:OW[l.o],img=l=>l.img?`<img src="${l.img}">`:`<span>${l.ic}</span>`;
const status=l=>l.st=='Paused'?'Paused':S.B.some(b=>b.lid==l.id&&['Confirmed','Active'].includes(b.st)&&b.s<=T&&b.e>=T)?'Booked':'Available';
const empty=(t,s,b)=>`<div class="box" style="text-align:center"><h2>${t}</h2><p>${s}</p>${b||''}</div>`;
const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
function toast(m,err){const t=$('#toast');t.textContent=m;t.style.display='block';t.style.background=err?'#c0291c':'';t.style.color=err?'#fff':'';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2300)}
function recent(q){q=q.trim().toLowerCase();if(q){S.rec=[q,...S.rec.filter(x=>x!=q)].slice(0,5);save()}}
function fl(){const q=ui.q.trim().toLowerCase();const a=S.L.filter(l=>l.st!=='Paused'&&(ui.cat=='All'||l.cat==ui.cat)&&l.p>=ui.min&&l.p<=ui.max&&(!ui.near||l.km<=7)&&(!q||(l.name+' '+l.cat+' '+(l.brand||'')+' '+(l.model||'')+' '+l.desc+' '+ow(l)).toLowerCase().includes(q)));const s=ui.sort;a.sort((x,y)=>s=='pl'?x.p-y.p:s=='ph'?y.p-x.p:s=='d'?x.km-y.km:s=='r'?y.r-x.r:0);return a}
const card=l=>`<div class="card"><div class="im" data-a="det" data-id="${l.id}">${img(l)}<button class="hrt" data-a="fav" data-id="${l.id}">${S.fav.includes(l.id)?'♥':'♡'}</button></div><div class="cb"><b>${esc(l.name)}</b><small>${esc(ow(l))} · ★ ${l.r}</small><small>📍 ${esc(l.loc)} · ${l.km} km away · ${l.cat}</small><div><b>${inr(l.p)}</b>/day <i class="tg">${status(l)=='Booked'?'Booked today':'Available'}</i></div><button class="btn" data-a="det" data-id="${l.id}">View Details</button></div></div>`;
function res(){if(!$('#res'))return;const a=fl();$('#res').innerHTML=`<p><small>${a.length} item${a.length==1?'':'s'}${ui.near?' within 7 km of Navrangpura, Ahmedabad':''}</small></p>`+(a.length?`<div class="grid">${a.map(card).join('')}</div>`:empty('No equipment found.','Try changing your category, location or price range.','<button class="btn o" data-a="rst">Reset filters</button>'))}
function market(){const pr=[['Under ₹500',0,499],['₹500–₹1,000',500,1000],['₹1,000–₹2,500',1000,2500],['₹2,500+',2500,5000]];
return `<input id="q" placeholder="Search camera, laptop, speaker, controller…" value="${esc(ui.q)}">`+(ui.v!='home'&&!ui.q?`<div class="chips"><small>Recent:</small>${S.rec.map(r=>`<button class="ch" data-a="q" data-v="${esc(r)}">${esc(r)}</button>`).join('')}<small>Popular:</small>${['camera','laptop','projector','speaker','controller'].map(r=>`<button class="ch" data-a="q" data-v="${r}">${r}</button>`).join('')}</div>`:'')+
`<div class="chips">${CATS.map(c=>`<button class="ch ${ui.cat==c?'on':''}" data-a="cat" data-v="${c}">${c}</button>`).join('')}<button class="ch ${ui.near?'on':''}" data-a="nearT">📍 Near Me</button></div>
<div class="flt"><label>Min ₹<input id="mn" type="number" min="0" value="${ui.min}"></label><label>Max ₹<input id="mx" type="number" min="0" value="${ui.max}"></label><select id="so">${[['rel','Featured'],['pl','Price: Low → High'],['ph','Price: High → Low'],['d','Distance: Nearest'],['r','Rating: Highest']].map(o=>`<option value="${o[0]}" ${ui.sort==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
<div class="chips">${pr.map(p=>`<button class="ch ${ui.min==p[1]&&ui.max==p[2]?'on':''}" data-a="pr" data-lo="${p[1]}" data-hi="${p[2]}">${p[0]}</button>`).join('')}<button class="ch" data-a="rst">Reset</button></div><div id="res"></div>`}
function ern(){const b=S.B.filter(b=>b.o==0),ok=b.filter(b=>b.n&&['Confirmed','Active','Completed'].includes(b.st)).reduce((a,b)=>a+b.rent,0);return{t:24850+ok,m:8400+ok,p:b.filter(b=>b.st=='Pending').reduce((a,b)=>a+b.rent,0),c:17+b.filter(b=>b.n&&b.st=='Completed').length}}
function bookings(){const mine=S.B.filter(b=>b.rid==0),cur=mine.filter(b=>TABS[ui.tab].includes(b.st));
return `<h2>My Bookings</h2><div class="chips">${Object.keys(TABS).map(t=>`<button class="ch ${ui.tab==t?'on':''}" data-a="tab" data-v="${t}">${t} (${mine.filter(b=>TABS[t].includes(b.st)).length})</button>`).join('')}</div>`+(cur.length?cur.map(b=>`<div class="box row"><div class="sp"><b>${esc(b.nm)}</b><br><small>${b.id} · ${b.s} → ${b.e} (${b.d} days)</small></div><b>${inr(b.rent+b.dep)}</b><span class="st ${b.st}">${b.st}</span>${TABS.Upcoming.includes(b.st)?`<button class="btn g" data-a="cancel" data-id="${b.id}">Cancel</button>`:''}</div>`).join(''):empty("You don't have any bookings yet.",'Rent something from the marketplace.',`<button class="btn o" data-a="nav" data-v="${S.mode=='business'?'search':'home'}">Browse equipment</button>`))}
function profile(){const m=S.me,b=S.mode=='business';return `<h2>Profile</h2><div class="box row"><div class="th" style="border-radius:50%;width:72px;height:72px;font:400 30px Anton">${esc(m.name[0]||'T')}</div><div class="sp"><b style="font-size:20px">${esc(m.name)}</b><br><small>${esc(m.email)} · ${esc(m.phone)}<br>📍 ${esc(m.loc)} · ★ 4.8 · ${S.ver?'✓ Verified':'Not verified'}</small></div></div><div class="chips">${[['Edit Profile','prof'],['Verification','ver'],['Payment Methods','pay'],['Settings','set']].map(x=>`<button class="btn g" data-a="${x[1]}">${x[0]}</button>`).join('')}<button class="btn o" data-a="mode" data-v="${b?'consumer':'business'}">Switch to ${b?'Consumer':'Business'} mode</button></div>`}
function dash(){const mine=S.L.filter(l=>l.o==0),pend=S.B.filter(b=>b.o==0&&b.st=='Pending').length;return `<section class="hero"><h1>Welcome back,<br><em>${esc(S.me.name)}</em></h1><p>Business mode: list your gear and keep renting from others.</p></section><div class="stats"><div class="box"><b>${mine.length}</b>Listings</div><div class="box"><b>${pend}</b>New requests</div><div class="box"><b>${inr(ern().m)}</b>This month</div></div><div class="tiles">${[['Search','search','🔍'],['Upload Equipment','upload','➕'],['My Equipment','equip','📦'],['Rental Requests','req','📥'],['Earnings','earn','💰'],['Bookings','bookings','🧾'],['Profile','profile','👤']].map(t=>`<button class="btn ${t[1]=='upload'?'o':''}" data-a="nav" data-v="${t[1]}">${t[2]} ${t[0]}</button>`).join('')}</div>`}
function equip(){const a=S.L.filter(l=>l.o==0);return `<div class="row"><h2 class="sp">My Equipment</h2><button class="btn o" data-a="new">+ Upload Equipment</button></div>`+(a.length?a.map(l=>`<div class="box row"><div class="th">${img(l)}</div><div class="sp"><b>${esc(l.name)}</b><br><small>${inr(l.p)}/day · ${l.v} views · ${S.B.filter(b=>b.lid==l.id).length} bookings</small></div><span class="st ${status(l)}">${status(l)}</span><button class="btn g" data-a="edit" data-id="${l.id}">Edit</button><button class="btn g" data-a="pause" data-id="${l.id}">${l.st=='Paused'?'Resume':'Pause'} Listing</button><button class="btn g" data-a="del" data-id="${l.id}">Delete</button></div>`).join(''):empty("You haven't listed any equipment yet.",'Publish your first item to start earning.','<button class="btn o" data-a="new">Upload Equipment</button>'))}
function reqs(){const a=S.B.filter(b=>b.o==0).reverse();return `<h2>Rental Requests</h2>`+(a.length?a.map(b=>`<div class="box row"><div class="sp"><b>${esc(b.nm)}</b> <span class="st ${b.st}">${b.st=='Pending'?'New Rental Request':b.st}</span><br><small>Customer: ${esc(b.rn)} · ${b.s} → ${b.e} (${b.d} days)<br>Total ${inr(b.rent)} · Security deposit ${inr(b.dep)}</small></div>${b.st=='Pending'?`<button class="btn o" data-a="acc" data-id="${b.id}">Accept</button><button class="btn g" data-a="dec" data-id="${b.id}">Decline</button>`:b.st=='Confirmed'?`<button class="btn g" data-a="done" data-id="${b.id}">Mark Completed</button>`:''}</div>`).join(''):empty('No rental requests yet.','Requests for your equipment will appear here.'))}
function earn(){const e=ern(),v=[3200,5100,4400,6800,5900,e.m],mx=Math.max(...v);return `<h2>Earnings</h2><div class="stats"><div class="box"><b>${inr(e.t)}</b>Total Earnings</div><div class="box"><b>${inr(e.m)}</b>This Month</div><div class="box"><b>${inr(e.p)}</b>Pending</div><div class="box"><b>${e.c}</b>Completed Rentals</div></div><div class="box"><b>Last 6 months</b><div class="bars" style="margin-top:12px">${v.map((x,i)=>`<div style="height:${x/mx*100}%" title="${inr(x)}"><span>${['May','Jun','Jul','Aug','Sep','Oct'][i]}</span></div>`).join('')}</div></div>`}
function view(){const v=ui.v;
if(v=='home')return `<section class="hero"><h1>Rent what you need.<br><em>Earn from what you own.</em></h1><p>Cameras, laptops, projectors, speakers and gaming gear from people near you in Ahmedabad.</p></section>`+market();
if(v=='search'||v=='near')return `<h2>${ui.near?'📍 Near Me':'Search'}</h2>`+market();
if(v=='favs'){const a=S.L.filter(l=>S.fav.includes(l.id));return `<h2>Favorites</h2>`+(a.length?`<div class="grid">${a.map(card).join('')}</div>`:empty('No favorites yet.','Tap the ♡ on any listing to save it.'))}
return{bookings,profile,dash,equip,req:reqs,earn}[v]()}
function fm(){const l=ui.m.id?gl(ui.m.id):{},fc=l.fc||Object.keys(FC).find(k=>FC[k]==l.cat)||'Camera',f=(id,lb,v,x='')=>`<label class="f">${lb}<input id="${id}" value="${esc(v??'')}" ${x}></label>`;
return `<h2>${ui.m.id?'Edit':'Upload'} equipment</h2><div id="er" class="er"></div>${f('f_n','Equipment name *',l.name,'placeholder="Sony A7 IV"')}<label class="f">Category<select id="f_c">${opt(Object.keys(FC),fc)}</select></label><label class="f">Description *<textarea id="f_d" rows="3">${esc(l.desc||'')}</textarea></label><label class="f">Condition<select id="f_cd">${opt(['Excellent','Good','Fair'],l.cond||'Excellent')}</select></label>${f('f_b','Brand',l.brand)}${f('f_m','Model',l.model)}${f('f_p','Price per day (₹) *',l.p,'type="number" min="1"')}${f('f_dp','Security deposit (₹) *',l.dep,'type="number" min="0"')}<label class="f">Location<select id="f_l">${opt(Object.keys(LK),l.loc||'Ahmedabad')}</select></label>${f('f_av','Availability',l.av,'placeholder="Every day, 9 AM – 9 PM"')}${f('f_ac','Included accessories',l.acc)}${f('f_ru','Rental rules',l.rules)}<label class="f">Photo<input id="f_im" type="file" accept="image/*"></label><div class="chips"><button class="btn o" data-a="pub">Publish Equipment</button><button class="btn g" data-a="close">Close</button></div>`}
function mod(){const m=ui.m,x=m.t,cl='<button class="btn g" data-a="close">Close</button>';
if(x=='det'){const l=gl(m.id),f=S.fav.includes(l.id);return `<div class="im" style="height:200px;border-radius:16px;cursor:default">${img(l)}</div><h2>${esc(l.name)}</h2><small>Owner: ${esc(ow(l))} (★ ${l.r}) · Product ★ ${l.r}<br>📍 ${esc(l.loc)} · ${l.km} km away · Condition: ${esc(l.cond)}</small><p>${esc(l.desc)}</p><div class="stats"><div class="box"><b>${inr(l.p)}</b>per day</div><div class="box"><b>${inr(l.dep)}</b>security deposit</div></div><small>Available: ${esc(l.av)}<br>Includes: ${esc(l.acc)}<br>Rules: ${esc(l.rules)}</small><div class="chips"><button class="btn o" data-a="rent" data-id="${l.id}">Rent Now</button><button class="btn g" data-a="fav" data-id="${l.id}">${f?'♥ Remove favorite':'♡ Add to Favorites'}</button><button class="btn g" data-a="contact">Contact Owner</button>${cl}</div>`}
if(x=='bk'){const l=gl(m.id);return `<h2>Rent ${esc(l.name)}</h2><label class="f">Start date<input id="sd" type="date" min="${T}" value="${m.s||dd(1)}"></label><label class="f">End date<input id="ed" type="date" min="${T}" value="${m.e||dd(3)}"></label><div class="box" id="sm" style="margin-top:12px"></div><div class="chips"><button class="btn o" data-a="bk">Confirm Rental</button>${cl}</div>`}
if(x=='ok'){const b=S.B.find(b=>b.id==m.id);return `<h2>Rental Confirmed!</h2><p>Booking ID: <b>${b.id}</b></p><div class="box"><b>${esc(b.nm)}</b><br>${b.s} → ${b.e} (${b.d} days)<br>Amount: ${inr(b.rent+b.dep)} (incl. ${inr(b.dep)} refundable deposit)<br><small>Pickup &amp; return at the owner's location, 10 AM. Awaiting owner acceptance.</small></div><div class="chips"><button class="btn o" data-a="goB">My Bookings</button>${cl}</div>`}
if(x=='ct')return `<h2>Contact ${esc(ow(gl(m.id)))}</h2><textarea rows="4" placeholder="Hi, is this still available?"></textarea><div class="chips"><button class="btn o" data-a="send">Send message</button>${cl}</div>`;
if(x=='fm')return fm();
if(x=='ls')return `<h2>Equipment Listed Successfully!</h2><p>It's now in My Equipment and visible in marketplace search.</p><div class="chips"><button class="btn o" data-a="goE">My Equipment</button>${cl}</div>`;
if(x=='dl')return `<h2>Delete listing?</h2><p>${esc(gl(m.id).name)} will be removed permanently.</p><div class="chips"><button class="btn o" data-a="delY">Delete</button>${cl}</div>`;
if(x=='prof'){const p=S.me;return `<h2>Edit profile</h2>${[['p_n','Name','name'],['p_e','Email','email'],['p_p','Phone','phone'],['p_l','Location','loc']].map(a=>`<label class="f">${a[1]}<input id="${a[0]}" value="${esc(p[a[2]])}"></label>`).join('')}<div class="chips"><button class="btn o" data-a="saveP">Save</button>${cl}</div>`}
if(x=='pay')return `<h2>Payment methods</h2><div class="box">UPI · toshan@okhdfc <span class="st Confirmed">Default</span></div><div class="box">HDFC Debit •••• 4321</div>${cl}`;
if(x=='set')return `<h2>Settings</h2><div class="chips"><button class="btn g" data-a="theme">Toggle dark mode</button><button class="btn g" data-a="rstAll">Reset demo data</button>${cl}</div>`}
function calc(){const l=gl(ui.m.id),s=$('#sd').value,e=$('#ed').value,d=s&&e?Math.round((new Date(e)-new Date(s))/864e5)+1:0,ok=s>=T&&e>=s&&d>0;ui.m.s=s;ui.m.e=e;
$('#sm').innerHTML=ok?`<div>${inr(l.p)} × ${d} day${d>1?'s':''} = <b>${inr(l.p*d)}</b></div><div>Security deposit = ${inr(l.dep)}</div><h2>Total payable: ${inr(l.p*d+l.dep)}</h2>`:'<span class="er">Please select valid rental dates.</span>';return ok?{s,e,d}:null}
function rd(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,480/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.onerror=()=>r(null);i.src=fr.result};fr.readAsDataURL(f)})}
const setB=(id,s)=>{S.B.find(b=>b.id==id).st=s;save();render();toast('Request '+s.toLowerCase())};
const A={sw:()=>{ui.sw=!ui.sw;render()},
mode:d=>{S.mode=d.v;ui.v=d.v=='business'?'dash':'home';ui.sw=0;ui.near=0;save();render();toast('Switched to '+d.v+' mode')},
nav:d=>{if(d.v=='upload')return A.new();ui.v=d.v;ui.near=d.v=='near';if(ui.near)ui.sort='d';render();scrollTo(0,0)},
cat:d=>{ui.cat=d.v;render()},q:d=>{ui.q=d.v;recent(d.v);render()},nearT:()=>{ui.near=!ui.near;ui.sort=ui.near?'d':'rel';render()},
pr:d=>{ui.min=+d.lo;ui.max=+d.hi;render()},rst:()=>{Object.assign(ui,{q:'',cat:'All',min:0,max:5000,sort:'rel',near:0});render()},
fav:d=>{const i=+d.id,k=S.fav.indexOf(i);k<0?S.fav.push(i):S.fav.splice(k,1);save();render();toast(k<0?'Added to favorites ♥':'Removed from favorites')},
det:d=>{const l=gl(d.id);l.v++;save();ui.m={t:'det',id:l.id};render()},rent:d=>{ui.m={t:'bk',id:+d.id};render()},
bk:()=>{const r=calc();if(!r)return toast('Please select valid rental dates.',1);const l=gl(ui.m.id),b={id:'RENT-'+S.nb++,lid:l.id,nm:l.name,o:l.o,rid:0,rn:S.me.name,s:r.s,e:r.e,d:r.d,rent:l.p*r.d,dep:l.dep,st:'Pending',n:1};S.B.push(b);save();ui.m={t:'ok',id:b.id};render()},
contact:()=>{ui.m={t:'ct',id:ui.m.id};render()},send:()=>{ui.m=null;render();toast('Message sent to the owner')},close:()=>{ui.m=null;render()},
goB:()=>{ui.m=null;ui.v='bookings';ui.tab='Upcoming';render()},goE:()=>{ui.m=null;ui.v='equip';render()},tab:d=>{ui.tab=d.v;render()},
cancel:d=>{S.B.find(b=>b.id==d.id).st='Cancelled';save();render();toast('Booking cancelled')},acc:d=>setB(d.id,'Confirmed'),dec:d=>setB(d.id,'Declined'),done:d=>setB(d.id,'Completed'),
new:()=>{ui.m={t:'fm'};render()},edit:d=>{ui.m={t:'fm',id:+d.id};render()},
pause:d=>{const l=gl(d.id);l.st=l.st=='Paused'?'Available':'Paused';save();render();toast(l.st=='Paused'?'Listing paused':'Listing live again')},
del:d=>{ui.m={t:'dl',id:+d.id};render()},delY:()=>{S.L=S.L.filter(l=>l.id!=ui.m.id);S.fav=S.fav.filter(i=>i!=ui.m.id);ui.m=null;save();render();toast('Listing deleted')},
async pub(){const g=i=>$('#'+i).value.trim(),er=[],n=g('f_n'),p=+g('f_p'),d=g('f_d');
if(!n)er.push('Equipment name is required.');if(!d)er.push('Please add a description.');if(!(p>0))er.push('Please enter a rental price.');if(g('f_dp')===''||+g('f_dp')<0)er.push('Please enter a security deposit.');
if(er.length){$('#er').innerHTML=er.join('<br>');return toast('Please fix the highlighted fields',1)}
const fc=g('f_c'),f=$('#f_im').files[0],im=f?await rd(f):null,e=ui.m.id?gl(ui.m.id):null,o={name:n,fc,cat:FC[fc],desc:d,cond:g('f_cd'),brand:g('f_b'),model:g('f_m'),p,dep:+g('f_dp'),loc:g('f_l'),km:LK[g('f_l')],av:g('f_av')||'Every day',acc:g('f_ac')||'None',rules:g('f_ru')||'Return in same condition.',ic:IC[FC[fc]]};if(im)o.img=im;
if(e){Object.assign(e,o);ui.m=null;toast('Listing updated')}else{S.L.unshift({id:S.nl++,o:0,r:5,st:'Available',v:0,...o});ui.m={t:'ls'}}save();render()},
prof:()=>{ui.m={t:'prof'};render()},saveP:()=>{const g=i=>$('#'+i).value.trim();if(!g('p_n'))return toast('Name is required.',1);Object.assign(S.me,{name:g('p_n'),email:g('p_e'),phone:g('p_p'),loc:g('p_l')});ui.m=null;save();render();toast('Profile saved')},
ver:()=>{if(S.ver)toast('Your identity is verified ✓');else{S.ver=1;save();render();toast('Verified ✓')}},pay:()=>{ui.m={t:'pay'};render()},set:()=>{ui.m={t:'set'};render()},
theme:()=>{const h=document.documentElement,dk=(h.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark';h.dataset.theme=dk?'light':'dark'},
rstAll:()=>{S=seed();ui.m=null;ui.v='home';save();render();toast('Demo data reset')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){const f=A[t.dataset.a];f&&f(t.dataset);return}if(e.target.id=='modal'){ui.m=null;render()}else if(ui.sw&&!e.target.closest('.sw')){ui.sw=0;render()}});
document.addEventListener('input',e=>{const i=e.target.id,v=e.target.value;if(i=='q'){ui.q=v;res()}else if(i=='mn'){ui.min=+v||0;res()}else if(i=='mx'){ui.max=v===''?99999:+v;res()}else if(i=='sd'||i=='ed')calc()});
document.addEventListener('change',e=>{if(e.target.id=='so'){ui.sort=e.target.value;res()}});
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;if(e.target.id=='q')recent(ui.q);if(e.target.id=='hq'){ui.q=e.target.value;recent(ui.q);ui.v='search';ui.near=0;render()}});
function render(){const b=S.mode=='business',nav=b?NB:NC,pc=S.B.filter(x=>x.o==0&&x.st=='Pending').length,
nb=(n,bn)=>`<button class="nv ${ui.v==n[1]?'on':''}" data-a="nav" data-v="${n[1]}">${bn?n[2]+'<span>'+n[0]+'</span>':n[0]}${n[1]=='req'&&pc?` (${pc})`:''}</button>`;
$('#app').innerHTML=`<header><span class="lg">Rent<b>Ease</b></span><input id="hq" placeholder="Search equipment…" value="${esc(ui.q)}"><div class="sw"><button class="btn o" data-a="sw">${b?'BUSINESS':'CONSUMER'} ▼</button>${ui.sw?`<div class="menu"><button data-a="mode" data-v="consumer">${b?'':'✓ '}Consumer</button><button data-a="mode" data-v="business">${b?'✓ ':''}Business</button></div>`:''}</div>${b?'':'<button class="btn g" data-a="nav" data-v="favs">♡</button>'}<button class="btn" data-a="nav" data-v="profile">${esc(S.me.name[0]||'T')}</button></header><nav class="tn">${nav.map(n=>nb(n)).join('')}</nav><main>${view()}</main><nav class="bn">${nav.filter(n=>n[3]).map(n=>nb(n,1)).join('')}</nav>`;
$('#modal').className=ui.m?'on':'';$('#modal').innerHTML=ui.m?`<div class="mb">${mod()}</div>`:'';res();if(ui.m&&ui.m.t=='bk')calc()}
render();
</script></body></html>
